<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <app-todo-form (emitNewTodo)="getNewTodo($event)"></app-todo-form>
        </div>
        <div class="col-md-7 offset-md-1">
            <app-todo-list
            (emitRemoveId)="getRemoveId($event)"
            [todoObj]="todoArr"
            ></app-todo-list>
        </div>
    </div>
</div>
