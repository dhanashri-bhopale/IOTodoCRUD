
<ng-container *ngIf="todoObj.length > 0; else notodos">
    <ul class="list-group">
        <li *ngFor="let todo of todoObj; trackBy: trackById" class="list-group-item d-flex justify-content-between">
            <strong>
                {{todo.todoItem}}
            </strong>
            <div>
                <button (click)="onEditTodo(todo)" class="mr-2" mat-mini-fab color="primary">
                    <mat-icon>edit</mat-icon>
                </button>
                <button
                (click)="onRemove(todo)"
                 mat-mini-fab color="warn">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </li>
    </ul>
</ng-container>

<ng-template #notodos>
    <p class="bg-warning text-white p-2">
        No Todos Item in the list!!!
    </p>
</ng-template>
